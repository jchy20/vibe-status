name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z, without v)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

concurrency:
  group: vibe-status-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'jchy20/vibe-status'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Version must be X.Y.Z"; exit 1;
          }
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            [[ "$(git rev-parse "refs/tags/v$version^{commit}")" == "$(git rev-parse HEAD)" ]] || {
              echo "::error::Existing version tag points to a different commit"; exit 1;
            }
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check public release repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo view "$GITHUB_REPOSITORY" --json visibility --jq '.visibility' | grep -qx PUBLIC

      - name: Test
        run: |
          python3 -m unittest discover -s Tests/Distribution -p 'test_*.py'
          xcodebuild -project VibeStatus.xcodeproj -scheme VibeStatus \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath DerivedData/Tests CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test

      - name: Build app and generate cask
        run: |
          bash scripts/build_release.sh "$RELEASE_VERSION" "$GITHUB_RUN_NUMBER"
          python3 scripts/generate_homebrew_cask.py "$RELEASE_VERSION" \
            "dist/releases/$RELEASE_VERSION/VibeStatus-$RELEASE_VERSION.zip" \
            --output "dist/releases/$RELEASE_VERSION/vibe-status.rb"
          ruby -c "dist/releases/$RELEASE_VERSION/vibe-status.rb"

      - name: Preserve validated release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VibeStatus-${{ steps.version.outputs.value }}
          path: |
            dist/releases/${{ steps.version.outputs.value }}/*.zip
            dist/releases/${{ steps.version.outputs.value }}/*.sha256
            dist/releases/${{ steps.version.outputs.value }}/vibe-status.rb
            dist/releases/${{ steps.version.outputs.value }}/release.json
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "dist/releases/$RELEASE_VERSION/VibeStatus-$RELEASE_VERSION.zip" \
            "dist/releases/$RELEASE_VERSION/VibeStatus-$RELEASE_VERSION.zip.sha256" \
            "dist/releases/$RELEASE_VERSION/vibe-status.rb" \
            "dist/releases/$RELEASE_VERSION/release.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Vibe Status $RELEASE_VERSION" --notes-file distribution/release-notes.md
          gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_homebrew_tap.py "$RELEASE_VERSION" \
            "dist/releases/$RELEASE_VERSION/vibe-status.rb"

      - name: Preserve failed release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/.release-*/build.log
            dist/.release-*/notarization*.json
            dist/.release-*/release.json
          include-hidden-files: true
          if-no-files-found: ignore
